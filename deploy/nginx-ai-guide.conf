map $uri $ai_guide_clean_uri {
    ~^(/ai-guide/.+)/$ $1;
    default $uri;
}
server {
    listen 80;
    server_name 182.92.150.8;
    root /srv/ai-guide/current;
    location = / { return 302 /ai-guide/; }
    location = /ai-guide { return 301 /ai-guide/; }
    location ^~ /ai-guide/ { index index.html; try_files $uri $ai_guide_clean_uri.html $uri/ =404; }
}
server {
    listen 80;
    server_name aiguide.org.cn;
    location ^~ /.well-known/acme-challenge/ { root /srv/ai-guide/acme; }
    location / { return 301 https://aiguide.org.cn$request_uri; }
}
server {
    listen 443 ssl;
    server_name aiguide.org.cn;
    ssl_certificate /etc/letsencrypt/live/aiguide.org.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aiguide.org.cn/privkey.pem;
    root /srv/ai-guide/current;
    location = / { return 302 /ai-guide/; }
    location = /ai-guide { return 301 /ai-guide/; }
    location ^~ /ai-guide/ { index index.html; try_files $uri $ai_guide_clean_uri.html $uri/ =404; }
}
